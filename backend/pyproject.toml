[project]
name = "guangcheng-agent-harness"
version = "0.1.0"
description = "A from-scratch, observable tool-calling Agent Runtime"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "openai>=1.60,<4",
  "httpx>=0.27,<1",
  "tiktoken>=0.8,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "pytest-cov>=6,<8", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/unit", "tests/integration"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true

[tool.coverage.html]
directory = "test-results/coverage/html"

[tool.coverage.xml]
output = "test-results/coverage/coverage.xml"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
